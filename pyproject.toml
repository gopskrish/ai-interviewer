[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-interviewer"
version = "0.1.0"
description = "Self-hosted AI interviewer for Microsoft Teams (free trial version)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "numpy>=2.0",
    "onnxruntime>=1.20",
    "faster-whisper>=1.2.1",
    "kokoro-onnx>=0.6.1",
    "piper-tts>=1.8.0",
    "cryptography>=43",
    "certifi>=2024.8.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
include = ["interviewer*"]

[tool.setuptools.package-data]
interviewer = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
